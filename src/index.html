<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <section
      class="card"
      data-qa="card"
    >
      <section class="card__picture-field">
        <img
          class="card__picture"
          src="./images/imac.jpeg"
          alt="Product image"
        />
      </section>
      <section class="card__name">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </section>
      <section class="card__code">Product code: 195434</section>
      <section class="card__rating">
        <section class="stars stars--4">
          <article class="stars__star"></article>
          <article class="stars__star"></article>
          <article class="stars__star"></article>
          <article class="stars__star"></article>
          <article class="stars__star"></article>
        </section>
        <section class="card__rating-revies">Reviews: 5</section>
      </section>
      <section class="card__price">
        <article class="card__price-name">Price:</article>
        <article class="card__price-amount">$2,199</article>
      </section>
      <a
        href="#"
        class="card__buy"
        data-qa="hover"
      >
        buy
      </a>
    </section>
  </body>
</html>
